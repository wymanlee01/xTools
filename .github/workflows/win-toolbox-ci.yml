# Windows 版的持续集成：改到 tools/win-toolbox 时，在 Windows 机器上编译全部项目并跑测试
name: win-toolbox ci

on:
  push:
    paths: ["tools/win-toolbox/**", ".github/workflows/win-toolbox-ci.yml"]
  pull_request:
    paths: ["tools/win-toolbox/**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/win-toolbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 编译
        run: dotnet build -c Release

      - name: 单元测试
        run: dotnet test -c Release --no-build
